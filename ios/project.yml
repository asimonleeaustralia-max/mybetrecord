name: MyBetRecord
options:
  bundleIdPrefix: com.mybetrecord
  deploymentTarget:
    iOS: "15.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.9"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
targets:
  MyBetRecord:
    type: application
    platform: iOS
    sources:
      - path: MyBetRecord
        excludes:
          - Resources/**
      - path: MyBetRecord/Resources/Locales
        buildPhase: resources
      - path: MyBetRecord/Resources/Assets.xcassets
        buildPhase: resources
      - path: MyBetRecord/Resources/PrivacyInfo.xcprivacy
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.mybetrecord.ios
        INFOPLIST_FILE: MyBetRecord/Resources/Info.plist
        GENERATE_INFOPLIST_FILE: false
        API_BASE_URL: https://www.mybetrecord.com
    configs:
      Debug:
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: DEBUG $(inherited)
      Release: {}
  MyBetRecordTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: MyBetRecordTests
    dependencies:
      - target: MyBetRecord
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.mybetrecord.ios.tests
        GENERATE_INFOPLIST_FILE: YES
